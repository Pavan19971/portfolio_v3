<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Project Screenshot Placeholder</title>
  <desc id="desc">Placeholder image for project screenshots</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="80" width="1440" height="740" rx="24" fill="#111827" stroke="#334155" stroke-width="4"/>
  <text x="800" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="56" fill="#e2e8f0" text-anchor="middle">
    Add Your Project Screenshot Here
  </text>
  <text x="800" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#94a3b8" text-anchor="middle">
    public/projects/&lt;your-image&gt;.png
  </text>
</svg>
